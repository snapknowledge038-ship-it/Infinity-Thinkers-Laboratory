<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITL - Catch the Knowledge!</title>
    <style>
        :root {
            --primary-glow: #00d4ff;
            --secondary-glow: #ff007a;
            --bg-dark: #050505;
        }

        body, html {
            height: 100%; margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-dark);
            color: #fff; overflow: hidden; 
            display: flex; align-items: center; justify-content: center;
        }

        .bg-stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        .ad-container { text-align: center; max-width: 800px; padding: 40px; z-index: 10; }

        /* --- ALWAYS ANIMATED TEXT --- */
        h1 {
            font-size: 65px; margin-bottom: 20px;
            background: linear-gradient(90deg, #fff, var(--primary-glow), var(--secondary-glow), #fff);
            background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: textFlow 4s linear infinite, floatText 3s ease-in-out infinite;
        }

        @keyframes textFlow { to { background-position: 200%; } }
        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        p {
            color: #ddd; font-size: 19px; line-height: 1.6;
            animation: breathText 4s ease-in-out infinite;
        }

        @keyframes breathText {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        /* --- THE BOUNCING ELEMENT (LOGO & CATCH ME) --- */
        #bouncingWrapper {
            position: absolute; z-index: 100;
            width: 140px; height: 140px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* Logo Styling */
        #logoImg {
            width: 130px; height: 130px; border-radius: 50%;
            box-shadow: 0 0 30px var(--primary-glow);
            transition: opacity 0.5s ease;
        }

        /* Catch Me Round Text Styling */
        #catchMe {
            position: absolute; width: 120px; height: 120px;
            background: var(--secondary-glow);
            color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 18px; text-align: center;
            box-shadow: 0 0 30px var(--secondary-glow);
            opacity: 0; transition: opacity 0.5s ease;
            text-transform: uppercase; border: 4px solid white;
            animation: pulseCatch 0.5s infinite alternate;
        }

        @keyframes pulseCatch {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* --- BUTTONS & SHARE --- */
        .index-btn {
            padding: 18px 50px; font-size: 24px; font-weight: bold; color: white;
            background: linear-gradient(45deg, var(--primary-glow), var(--secondary-glow));
            border-radius: 50px; text-decoration: none; display: inline-block;
            animation: pulseBtn 2s infinite ease-in-out; margin-top: 20px;
        }

        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        #share-wrapper { position: fixed; bottom: 30px; left: 30px; z-index: 1000; text-align: center; }
        .arrow-pointer { font-size: 45px; color: var(--secondary-glow); animation: bounceDown 0.6s infinite alternate; }
        @keyframes bounceDown { from { transform: translateY(0); } to { transform: translateY(15px); } }

        .share-btn {
            background: rgba(0, 212, 255, 0.1); color: white; border: 2px solid var(--primary-glow);
            padding: 12px 28px; border-radius: 15px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="bg-stars"></div>

    <a href="index.html" id="bouncingWrapper">
        <img src="images/ITL.jpeg" alt="ITL Logo" id="logoImg">
        <div id="catchMe">CATCH<br>ME!</div>
    </a>

    <div class="ad-container">
        <h1>Discover ITL</h1>
        <p>Explore the wonders of 🦖 dinosaurs, 🔮 mysteries, 🔬 science, and the 🌍 universe. 
           Experience knowledge in a way that brings learning to life!</p>
        <a href="index.html" class="index-btn">EXPLORE NOW 🚀</a>
    </div>

    <div id="share-wrapper">
        <div style="background:rgba(255,255,255,0.1); padding:10px; border-radius:10px; font-size:12px; margin-bottom:5px;">Help us grow! 🤝</div>
        <div class="arrow-pointer">↓</div>
        <button onclick="sharePage()" class="share-btn">SHARE WITH FRIENDS</button>
    </div>

    <script>
        const wrapper = document.getElementById('bouncingWrapper');
        const logo = document.getElementById('logoImg');
        const catchMe = document.getElementById('catchMe');

        // Bouncing Logic
        let posX = Math.random() * (window.innerWidth - 140);
        let posY = Math.random() * (window.innerHeight - 140);
        let velX = 2.5; let velY = 2.5;

        function animate() {
            if (posX + 140 >= window.innerWidth || posX <= 0) velX *= -1;
            if (posY + 140 >= window.innerHeight || posY <= 0) velY *= -1;
            posX += velX; posY += velY;
            wrapper.style.left = posX + 'px';
            wrapper.style.top = posY + 'px';
            requestAnimationFrame(animate);
        }
        animate();

        // 3s Image, 2s Catch Me logic
        function toggleDisplay() {
            // Show Logo for 3 seconds
            logo.style.opacity = "1";
            catchMe.style.opacity = "0";

            setTimeout(() => {
                // After 3s, Show Catch Me for 2 seconds
                logo.style.opacity = "0";
                catchMe.style.opacity = "1";

                setTimeout(() => {
                    toggleDisplay(); // Repeat the loop
                }, 2000);

            }, 3000);
        }
        toggleDisplay();

        async function sharePage() {
            try {
                if (navigator.share) {
                    await navigator.share({ title: 'ITL', text: 'Check out ITL! 🚀', url: window.location.href });
                } else {
                    navigator.clipboard.writeText(window.location.href);
                    alert("Link copied! 🚀");
                }
            } catch (err) { console.log(err); }
        }

        // Stars Background
        const bg = document.querySelector('.bg-stars');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.width = '2px'; star.style.height = '2px';
            star.style.background = 'white'; star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%'; star.style.opacity = Math.random();
            bg.appendChild(star);
        }
    </script>
</body>
</html>
