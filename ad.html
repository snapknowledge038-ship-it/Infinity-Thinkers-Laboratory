<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITL - Always Exploring</title>
    <style>
        :root {
            --primary-glow: #00d4ff;
            --secondary-glow: #ff007a;
            --bg-dark: #050505;
        }

        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            overflow: hidden; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        .ad-container {
            text-align: center;
            max-width: 800px;
            padding: 40px;
            z-index: 10;
        }

        /* --- ALWAYS ANIMATED TEXT --- */
        
        /* 1. Main Title - Floating & Glowing */
        h1 {
            font-size: 65px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fff, var(--primary-glow), var(--secondary-glow), #fff);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            
            /* Animations */
            animation: 
                textFlow 4s linear infinite, 
                floatText 3s ease-in-out infinite;
        }

        @keyframes textFlow { 
            to { background-position: 200%; } 
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 10px rgba(0,212,255,0.3)); }
            50% { transform: translateY(-15px); filter: drop-shadow(0 0 25px rgba(0,212,255,0.6)); }
        }

        /* 2. Description - Breathing/Pulse Effect */
        p {
            color: #ddd;
            font-size: 19px;
            max-width: 650px;
            margin: 0 auto 30px auto;
            line-height: 1.6;
            
            /* Always Animate */
            animation: breathText 4s ease-in-out infinite;
        }

        @keyframes breathText {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); color: #fff; }
        }

        /* --- BOUNCING LOGO --- */
        .logo-link {
            position: absolute;
            z-index: 100;
            cursor: pointer;
        }

        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            box-shadow: 0 0 30px var(--primary-glow);
            animation: rotateLogo 10s linear infinite;
        }

        @keyframes rotateLogo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- STABLE BUTTON --- */
        .index-btn {
            padding: 18px 50px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, var(--primary-glow), var(--secondary-glow));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            display: inline-block;
            animation: pulseBtn 2s infinite ease-in-out;
        }

        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 212, 255, 0.6); }
            50% { transform: scale(1.15); box-shadow: 0 0 40px rgba(255, 0, 122, 0.9); }
        }

        /* --- SHARE SECTION (Focus Arrow) --- */
        #share-wrapper {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .share-help-text {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            border-bottom: 3px solid var(--secondary-glow);
            backdrop-filter: blur(10px);
            margin-bottom: 5px;
            animation: pulseHelp 2s infinite alternate;
        }

        @keyframes pulseHelp {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.05); opacity: 1; }
        }

        .arrow-pointer {
            font-size: 45px;
            color: var(--secondary-glow);
            animation: bounceDown 0.6s infinite alternate;
        }

        @keyframes bounceDown {
            from { transform: translateY(0); }
            to { transform: translateY(15px); }
        }

        .share-btn {
            background: rgba(0, 212, 255, 0.1);
            color: white;
            border: 2px solid var(--primary-glow);
            padding: 12px 28px;
            border-radius: 15px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
        }

        .share-btn:hover { background: var(--primary-glow); color: #000; }

    </style>
</head>
<body>

    <div class="bg-stars"></div>

    <a href="index.html" class="logo-link" id="bouncingLogo">
        <img src="images/ITL.jpeg" alt="ITL Logo" class="logo">
    </a>

    <div class="ad-container">
        <h1>Discover ITL</h1>
        <p>
            Dive into the world of 🦖 dinosaurs, 🔮 mysteries, 🔬 science, and the 🌍 universe. 
            Experience fascinating facts in an engaging way that brings learning to life!
        </p>
        
        <a href="index.html" class="index-btn">EXPLORE NOW 🚀</a>
    </div>

    <div id="share-wrapper">
        <div class="share-help-text">Help us grow by sharing! 🤝</div>
        <div class="arrow-pointer">↓</div>
        <button onclick="sharePage()" class="share-btn">
            <span>🔗</span> SHARE WITH FRIENDS
        </button>
    </div>

    <script>
        // Logo Bouncing logic
        const logo = document.getElementById('bouncingLogo');
        let posX = Math.random() * (window.innerWidth - 130);
        let posY = Math.random() * (window.innerHeight - 130);
        let velX = 2; let velY = 2;

        function animate() {
            if (posX + 130 >= window.innerWidth || posX <= 0) velX *= -1;
            if (posY + 130 >= window.innerHeight || posY <= 0) velY *= -1;
            posX += velX; posY += velY;
            logo.style.left = posX + 'px';
            logo.style.top = posY + 'px';
            requestAnimationFrame(animate);
        }
        animate();

        async function sharePage() {
            try {
                if (navigator.share) {
                    await navigator.share({ title: 'ITL', text: 'Check out ITL! 🚀', url: window.location.href });
                } else {
                    navigator.clipboard.writeText(window.location.href);
                    alert("Link copied! 🚀");
                }
            } catch (err) { console.log(err); }
        }

        // Stars
        const bg = document.querySelector('.bg-stars');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.width = '2px';
            star.style.height = '2px';
            star.style.background = 'white';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.borderRadius = '50%';
            star.style.opacity = Math.random();
            bg.appendChild(star);
        }
    </script>
</body>
</html>
