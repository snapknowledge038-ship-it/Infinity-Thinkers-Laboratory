<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Thinkers Laboratory</title>
    <meta name="description" content="Infinity Thinkers Laboratory is a digital encyclopedia designed for explorers of all ages.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-glow: #00d4ff;
            --secondary-glow: #ff007a;
            --bg-dark: #050505;
        }

        body, html {
            height: 100%; margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-dark);
            color: #fff; overflow: hidden; 
            display: flex; align-items: center; justify-content: center;
        }

        .bg-stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        /* --- ENTRANCE ANIMATIONS --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes subtlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .ad-container { 
            text-align: center; max-width: 850px; padding: 40px; z-index: 10;
            animation: fadeInUp 1.2s ease-out forwards;
        }

        /* --- FIXED LOGO WITH SUBTLE ANIMATION --- */
        #staticWrapper {
            position: fixed;
            top: 40px; left: 40px; z-index: 100;
            width: 110px; height: 110px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            text-decoration: none;
            /* Logo එක සෙමින් පණ ගැන්වේ */
            animation: fadeInUp 1s ease-out, subtlePulse 4s ease-in-out infinite;
        }

        #logoImg {
            width: 100%; height: 100%; border-radius: 50%;
            box-shadow: 0 0 20px var(--primary-glow);
            transition: 0.5s ease;
        }

        #catchMe {
            position: absolute; width: 100%; height: 100%;
            background: var(--secondary-glow);
            color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 13px; text-align: center;
            opacity: 0; transition: 0.5s ease;
            text-transform: uppercase; border: 3px solid #fff;
        }

        #staticWrapper:hover #logoImg { opacity: 0; transform: scale(0.9) rotate(-10deg); }
        #staticWrapper:hover #catchMe { opacity: 1; transform: scale(1.1); }

        /* --- TEXT ANIMATIONS --- */
        h1 {
            font-size: clamp(35px, 8vw, 65px);
            margin-bottom: 20px; font-weight: 900;
            color: #fff;
            text-shadow: 0 0 15px var(--primary-glow);
            animation: fadeInUp 1s ease-out 0.3s backwards; /* Delay සහිතව */
        }

        p { 
            color: #ccc; font-size: 19px; line-height: 1.7; 
            animation: fadeInUp 1s ease-out 0.6s backwards;
        }

        /* --- BUTTON ANIMATION --- */
        .index-btn {
            padding: 18px 50px; font-size: 22px; font-weight: bold; color: white;
            background: linear-gradient(45deg, var(--primary-glow), var(--secondary-glow));
            border-radius: 50px; text-decoration: none; display: inline-block;
            margin-top: 25px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
            animation: fadeInUp 1s ease-out 0.9s backwards;
        }

        .index-btn:hover { 
            transform: scale(1.1); 
            box-shadow: 0 0 30px var(--primary-glow);
            letter-spacing: 1px;
        }

        /* --- SHARE SECTION --- */
        #share-wrapper {
            position: fixed; bottom: 30px; left: 30px; z-index: 1000;
            animation: fadeInUp 1s ease-out 1.2s backwards;
        }

        .share-btn {
            background: rgba(255, 255, 255, 0.05); color: white; border: 1px solid var(--primary-glow);
            padding: 10px 25px; border-radius: 12px; cursor: pointer; font-weight: bold;
            transition: 0.3s; backdrop-filter: blur(5px);
        }

        .share-btn:hover { background: var(--primary-glow); color: #000; transform: translateY(-3px); }
    </style>
</head>
<body>

    <div class="bg-stars" id="starField"></div>

    <!-- ස්ථාවර නමුත් සෙමින් Pulse වන Logo එක -->
    <a href="https://snapknowledge038-ship-it.github.io/Infinity-Thinkers-Laboratory/" id="staticWrapper">
        <img src="https://snapknowledge038-ship-it.github.io/Infinity-Thinkers-Laboratory/images/ITL.jpeg" alt="ITL Logo" id="logoImg">
        <div id="catchMe">ENTER<br>LAB</div>
    </a>

    <div class="ad-container">
        <h1>Infinity Thinkers Laboratory</h1>
        <p>
            Dive into a digital encyclopedia designed for curious minds. 
            From the giants of the 🦖 <b>Prehistoric Era</b> to the secrets of 🔮 <b>Ancient Mythology</b> 
            and the frontiers of 🚀 <b>Space & Tech</b>.
        </p>
        <a href="https://snapknowledge038-ship-it.github.io/Infinity-Thinkers-Laboratory/" class="index-btn">EXPLORE NOW 🚀</a>
    </div>

    <div id="share-wrapper">
        <button onclick="sharePage()" class="share-btn">SHARE WITH FRIENDS</button>
    </div>

    <script>
        async function sharePage() {
            const shareData = {
                title: 'Infinity Thinkers Laboratory',
                text: 'Discover mind-blowing facts about dinosaurs, space, and ancient mysteries! 🦖🚀',
                url: 'https://snapknowledge038-ship-it.github.io/Infinity-Thinkers-Laboratory/'
            };
            try {
                if (navigator.share) { await navigator.share(shareData); } 
                else {
                    navigator.clipboard.writeText(shareData.url);
                    alert("Link copied! 🚀");
                }
            } catch (err) { console.log(err); }
        }

        const starField = document.getElementById('starField');
        for (let i = 0; i < 40; i++) {
            const star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.width = '2px'; star.style.height = '2px';
            star.style.background = 'rgba(255, 255, 255, 0.2)';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.borderRadius = '50%';
            starField.appendChild(star);
        }
    </script>
</body>
</html>
