<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Thinkers Laboratory</title>
    <meta name="description" content="Infinity Thinkers Laboratory is a digital encyclopedia designed for explorers of all ages.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-glow: #00d4ff;
            --secondary-glow: #ff007a;
            --bg-dark: #050509;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        /* මූලික සැකසුම් */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        body, html {
            height: 100%; width: 100%;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- 1. පසුබිම (Space & Nebula) --- */
        .bg-stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
        }

        .bg-stars::before {
            content: "";
            position: absolute; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 10% 70%, rgba(0, 150, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 20%, rgba(255, 0, 150, 0.15) 0%, transparent 40%);
            filter: blur(50px);
        }

        /* Top Header Control Bar */
        .top-controls {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 25px;
            z-index: 10;
        }

        /* Language Toggle Button Style */
        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--primary-glow);
            color: var(--primary-glow);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
            font-family: 'Poppins', sans-serif;
        }

        .lang-btn:hover {
            background: var(--primary-glow);
            color: #000;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* --- 2. මධ්‍ය කාඩ්පත (Main Glass Card) --- */
        .main-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 60px 40px;
            width: 90%;
            max-width: 700px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 1.2s ease-out;
        }

        /* --- 3. සජීවී ලාංඡනය (Animated Logo) --- */
        .logo-wrapper {
            position: relative;
            width: 110px; height: 110px;
            margin: 0 auto 30px auto;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
            animation: subtlePulse 4s ease-in-out infinite;
        }

        .logo-img {
            width: 100%; height: 100%; border-radius: 50%;
            box-shadow: 0 0 20px var(--primary-glow);
            transition: 0.5s ease;
            object-fit: cover;
            border: 2px solid var(--primary-glow);
        }

        .catch-me {
            position: absolute; width: 100%; height: 100%;
            background: var(--secondary-glow);
            color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 13px; text-align: center;
            opacity: 0; transition: 0.5s ease;
            text-transform: uppercase; border: 3px solid #fff;
        }

        .logo-wrapper:hover .logo-img { opacity: 0; transform: scale(0.9) rotate(-10deg); }
        .logo-wrapper:hover .catch-me { opacity: 1; transform: scale(1.1); }

        /* --- 4. අකුරු සහ බොත්තම් (Typography & Buttons) --- */
        h1 {
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 900;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 15px var(--primary-glow);
        }

        p {
            color: #b0b8c3;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 40px;
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
        }

        .explore-btn {
            display: inline-block;
            width: 100%; max-width: 400px;
            padding: 18px;
            font-size: 20px;
            font-weight: 700;
            color: white;
            text-decoration: none;
            background: linear-gradient(90deg, #38bdf8 0%, #c026d3 100%);
            border-radius: 50px;
            text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(192, 38, 211, 0.4);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 30px;
        }

        .explore-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--primary-glow);
            letter-spacing: 1px;
        }

        .share-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            padding: 12px 30px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .share-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-color: white;
        }

        /* --- Animations --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes subtlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        @media (max-width: 480px) {
            .main-card { padding: 40px 20px; }
            h1 { font-size: 24px; }
            p { font-size: 14px; }
            .top-controls { padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <!-- Top Control Bar (Language & Music) -->
    <div class="top-controls">
        <button id="langToggle" class="lang-btn" onclick="toggleLanguage()">සිංහල</button>
        <div id="music-control" onclick="toggleMusic()" style="cursor: pointer; font-size: 22px; user-select: none;">
            <span id="music-icon">🔇</span>
        </div>
    </div>

    <!-- Audio File එක -->
    <audio id="myAudio" loop>
        <source src="mp3/nastelbom-no-copyright-music-490159.mp3" type="audio/mpeg">
    </audio>

    <div class="bg-stars"></div>

    <div class="main-card">
        <!-- Logo -->
        <a href="https://snapknowledge038-ship-it.github.io/Infinity-Thinkers-Laboratory/" class="logo-wrapper">
            <img src="https://snapknowledge038-ship-it.github.io/Infinity-Thinkers-Laboratory/images/ITL.jpeg" alt="ITL Logo" class="logo-img">
            <div class="catch-me" data-en="ENTER<br>LAB" data-si="ඇතුල් වන්න<br>LAB">ENTER<br>LAB</div>
        </a>

        <!-- Content -->
        <h1>Infinity Thinkers Laboratory</h1>
        <p data-en="Dive into a digital encyclopedia designed for explorers of all ages. From the giants of the 🦖 Prehistoric Era to the secrets of 🔮 Ancient Mythology and the frontiers of 🚀 Space & Tech."
           data-si="සියලුම වයස්වල ගවේෂකයන් සඳහා නිර්මාණය කර ඇති ඩිජිටල් විශ්වකෝෂයකට කිමිදෙන්න. 🦖 ප්‍රාග් ඓතිහාසික යුගයේ දැවැන්තයන්ගේ සිට 🔮 පුරාණ මිථ්‍යා කථා වල රහස් සහ 🚀 අභ්‍යවකාශ හා තාක්ෂණයේ සීමාවන් දක්වා මෙහි අන්තර්ගත වේ.">
            Dive into a digital encyclopedia designed for explorers of all ages. 
            From the giants of the 🦖 Prehistoric Era to the secrets of 🔮 Ancient Mythology 
            and the frontiers of 🚀 Space & Tech.
        </p>

        <!-- Buttons -->
        <a href="https://snapknowledge038-ship-it.github.io/Infinity-Thinkers-Laboratory/" class="explore-btn" data-en="EXPLORE NOW 🚀" data-si="දැන් ගවේෂණය කරන්න 🚀">EXPLORE NOW 🚀</a>
        <br>
        <button onclick="sharePage()" class="share-btn" data-en="SHARE WITH FRIENDS" data-si="මිතුරන් සමඟ බෙදාගන්න">SHARE WITH FRIENDS</button>
    </div>

    <script>
        async function sharePage() {
            let currentLang = localStorage.getItem("preferredLanguage") || "en";
            
            const shareData = {
                title: 'Infinity Thinkers Laboratory',
                text: currentLang === 'si' 
                    ? 'දිනසෝරයන්, අභ්‍යවකාශය සහ පැරණි අභිරහස් ගැන පුදුම හිතෙන කරුණු සොයා ගන්න! 🦖🚀' 
                    : 'Discover mind-blowing facts about dinosaurs, space, and ancient mysteries! 🦖🚀',
                url: 'https://snapknowledge038-ship-it.github.io/Infinity-Thinkers-Laboratory/'
            };
            
            try {
                if (navigator.share) { 
                    await navigator.share(shareData); 
                } else {
                    navigator.clipboard.writeText(shareData.url);
                    alert(currentLang === 'si' ? "ලින්ක් එක කොපි කරගත්තා! 🚀" : "Link copied! 🚀");
                }
            } catch (err) { 
                console.log(err); 
            }
        }

        // --- භාෂා මාරු කිරීමේ පද්ධතිය (Language Switcher Logic) ---
        function toggleLanguage() {
            let currentLang = localStorage.getItem("preferredLanguage") || "en";
            let newLang = (currentLang === "en") ? "si" : "en";
            
            localStorage.setItem("preferredLanguage", newLang);
            applyLanguage(newLang);
        }

        function applyLanguage(lang) {
            const btn = document.getElementById("langToggle");
            
            if (lang === "si") {
                btn.textContent = "English";
            } else {
                btn.textContent = "සිංහල";
            }

            const elements = document.querySelectorAll('[data-en], [data-si]');
            elements.forEach(el => {
                if (lang === "si") {
                    if (el.getAttribute('data-si')) {
                        // HTML Tags ඇතුලේ තියෙන සිංහල අකුරු වෙනස් කිරීම (<br> ටැග් එක වැඩ කිරීමට innerHTML යොදා ඇත)
                        el.innerHTML = el.getAttribute('data-si');
                    }
                } else {
                    if (el.getAttribute('data-en')) {
                        el.innerHTML = el.getAttribute('data-en');
                    }
                }
            });
        }

        // පිටුව මුලින්ම ලෝඩ් වන විට ක්‍රියාත්මක වන කොටස
        document.addEventListener("DOMContentLoaded", () => {
            let savedLang = localStorage.getItem("preferredLanguage") || "en";
            applyLanguage(savedLang);
        });
    </script>
    <script src="music.js"></script>
</body>
</html>
