<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to ITL - Journey of Knowledge</title>
    <style>
        :root {
            --primary-glow: #00d4ff;
            --secondary-glow: #ff007a;
            --bg-dark: #050505;
        }

        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            overflow: hidden; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        .ad-container {
            text-align: center;
            max-width: 800px;
            padding: 40px;
            z-index: 10;
            animation: fadeInScale 2s ease-out forwards;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.8); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        /* --- LOGO ANIMATION (Floating everywhere) --- */
        .logo-link {
            position: absolute;
            z-index: 100;
            cursor: pointer;
            text-decoration: none;
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            box-shadow: 0 0 30px var(--primary-glow);
            transition: transform 0.3s ease;
        }

        /* --- INDEX BUTTON --- */
        .index-btn {
            padding: 15px 45px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, var(--primary-glow), var(--secondary-glow));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            display: inline-block;
            animation: pulseBtn 2s infinite ease-in-out;
        }

        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* --- SHARE SECTION WITH ARROW --- */
        #share-wrapper {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }

        /* Help Text */
        .share-help-text {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 13px;
            border-left: 4px solid var(--secondary-glow);
            backdrop-filter: blur(5px);
            max-width: 200px;
            line-height: 1.4;
            animation: slideInLeft 1s ease-out;
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Animated Arrow */
        .arrow-pointer {
            font-size: 40px;
            color: var(--secondary-glow);
            margin-left: 20px;
            animation: pointDown 1s infinite alternate;
            filter: drop-shadow(0 0 10px var(--secondary-glow));
        }

        @keyframes pointDown {
            from { transform: translateY(0); }
            to { transform: translateY(15px); }
        }

        .share-btn {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 2px solid var(--primary-glow);
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .share-btn:hover {
            background: var(--primary-glow);
            color: black;
            transform: scale(1.05);
        }

        /* General Styles */
        h1 { font-size: 50px; background: linear-gradient(90deg, #fff, var(--primary-glow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #ccc; max-width: 600px; margin: 0 auto 20px auto; }

    </style>
</head>
<body>

    <div class="bg-stars"></div>

    <a href="index.html" class="logo-link" id="movingLogo">
        <img src="images/ITL.jpeg" alt="ITL Logo" class="logo">
    </a>

    <div class="ad-container">
        <h1>Discover ITL</h1>
        <p>
            ITL is a platform created for curious minds who love exploring new knowledge every day.
            Our content is simple, clear, and engaging.
        </p>
        <a href="index.html" class="index-btn">EXPLORE NOW 🚀</a>
    </div>

    <div id="share-wrapper">
        <div class="share-help-text">
            අපට උදව්වක් ලෙස ITL ගැන ඔයාගේ හිතවතුන් අතරේ Share කරන්න! 🤝
        </div>
        <div class="arrow-pointer">↓</div>
        <button onclick="sharePage()" class="share-btn">
            <span>🔗</span> SHARE WITH FRIENDS
        </button>
    </div>

    <script>
        // Logo Animation
        const logo = document.getElementById('movingLogo');
        let posX = Math.random() * (window.innerWidth - 120);
        let posY = Math.random() * (window.innerHeight - 120);
        let velX = 2; let velY = 2;

        function animateLogo() {
            if (posX + 120 >= window.innerWidth || posX <= 0) velX *= -1;
            if (posY + 120 >= window.innerHeight || posY <= 0) velY *= -1;
            posX += velX; posY += velY;
            logo.style.left = posX + 'px';
            logo.style.top = posY + 'px';
            requestAnimationFrame(animateLogo);
        }
        animateLogo();

        // Share function
        async function sharePage() {
            try {
                if (navigator.share) {
                    await navigator.share({
                        title: 'ITL Journey',
                        text: 'අලුත් දේවල් ඉගෙන ගන්න ITL එක්ක එකතු වෙන්න! 🚀',
                        url: window.location.href
                    });
                } else {
                    navigator.clipboard.writeText(window.location.href);
                    alert("Link copied! Share it with your friends. 🚀");
                }
            } catch (err) { console.log(err); }
        }

        // Stars
        const bg = document.querySelector('.bg-stars');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.width = '2px';
            star.style.height = '2px';
            star.style.background = 'white';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.opacity = Math.random();
            bg.appendChild(star);
        }
    </script>
</body>
</html>
