    <script> 
        // Sidebar Toggle Function
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebarMenu");
            const overlay = document.getElementById("sidebarOverlay");
            
            sidebar.classList.toggle("open");
            overlay.classList.toggle("show");
        }

        // --- භාෂා මාරු කිරීමේ පද්ධතිය (Language Switcher Logic) ---
        function toggleLanguage() {
            // දැනට තියෙන භාෂාව පරික්ෂා කරලා අනෙක් භාෂාව තෝරාගැනීම
            let currentLang = localStorage.getItem("preferredLanguage") || "en";
            let newLang = (currentLang === "en") ? "si" : "en";
            
            // තෝරාගත් භාෂාව සේව් කිරීම
            localStorage.setItem("preferredLanguage", newLang);
            
            // පිටුව update කිරීම
            applyLanguage(newLang);
        }

        function applyLanguage(lang) {
            const btn = document.getElementById("langToggle");
            
            // බොත්තමේ text එක වෙනස් කිරීම
            if (lang === "si") {
                btn.textContent = "English";
            } else {
                btn.textContent = "සිංහල";
            }

            // data-en සහ data-si තියෙන හැම element එකක්ම වෙනස් කිරීම
            const elements = document.querySelectorAll('[data-en], [data-si]');
            elements.forEach(el => {
                if (lang === "si") {
                    if (el.getAttribute('data-si')) {
                        // සාමාන්‍ය tags වලට innerText දානවා, හැබැයි span එකක් ඇතුලේ highlight එක රැකගන්න ඕන නිසා textContent හෝ innerHTML බලනවා
                        if(el.tagName === "A" || el.tagName === "P" || el.tagName === "H1" || el.tagName === "H2" || el.tagName === "SPAN" || el.tagName === "DIV") {
                            el.textContent = el.getAttribute('data-si');
                        }
                    }
                } else {
                    if (el.getAttribute('data-en')) {
                        if(el.tagName === "A" || el.tagName === "P" || el.tagName === "H1" || el.tagName === "H2" || el.tagName === "SPAN" || el.tagName === "DIV") {
                            el.textContent = el.getAttribute('data-en');
                        }
                    }
                }
            });
        }

        // පිටුව මුලින්ම Load වන විට කලින් තේරූ භාෂාව ක්‍රියාත්මක කිරීම
        document.addEventListener("DOMContentLoaded", () => {
            let savedLang = localStorage.getItem("preferredLanguage") || "en";
            applyLanguage(savedLang);
        });
    </script>
