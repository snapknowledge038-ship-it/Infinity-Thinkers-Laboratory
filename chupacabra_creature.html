<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags for Social Media Sharing -->
    <meta name="description" content="Discover the mystery of the legendary Chupacabra. / පුරාවෘත්තයක් වූ චුපකබ්රා (Chupacabra) පිළිබඳ අභිරහස සොයා ගන්න.">
    <meta property="og:title" content="The Chupacabra - I T L">
    <meta property="og:description" content="Uncovering the truth behind the goat-sucker. / එළුවන් උරා බොන මෘගයා පිළිබඳ සත්‍යය සොයා යමු.">
    <meta property="og:image" content="images/chupacabra_creature.jpg">
    <meta property="og:url" content="https://yourwebsite.com/chupacabra.html">
    <meta property="og:type" content="article">
    
    <title>The Chupacabra - I T L</title>
    
    <style>
        /* මූලික සැකසුම් */
        body { font-family: 'Garamond', 'Georgia', serif; background-color: #020905; color: #d0dad4; margin: 0; padding: 0; line-height: 1.8; }
        
        /* Language Toggle Button Style */
        .lang-btn { background: #1b4d22; color: white; border: 1px solid #39ff14; padding: 5px 12px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        
        /* Navigation & Sidebar (as per your request) */
        nav { background-color: #1a1a1a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 1000; }
        .nav-controls { display: flex; align-items: center; gap: 15px; }
        .menu-toggle { background: none; border: none; color: #00d4ff; font-size: 28px; cursor: pointer; }
        
        /* Language Content Toggling Classes */
        .lang-si { display: none; }
        
        /* Layout */
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { font-size: clamp(40px, 9vw, 80px); text-align: center; color: #39ff14; margin-top: 40px; }
        section { background: rgba(4, 20, 10, 0.6); padding: 35px; border-radius: 8px; margin-bottom: 35px; border: 1px solid #0d3315; }
        h2 { color: #39ff14; font-size: 32px; }
    </style>
</head>
<body>

<nav>
    <a href="index.html" style="color: #00d4ff; text-decoration: none; font-weight: bold;">🏠 <span class="lang-en">Home</span><span class="lang-si">මුල් පිටුව</span></a>
    <div class="nav-controls">
        <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">සිංහල</button>
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    </div>
</nav>

<!-- Sidebar Overlay & Content (Include your existing sidebar HTML here) -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebarMenu">...</div>

<div class="container">
    <h1>The Chupacabra</h1>
    
    <section>
        <div class="lang-en">
            <h3>Translating literally from Spanish as the "goat-sucker," the <strong>Chupacabra</strong> is a legendary cryptid.</h3>
        </div>
        <div class="lang-si">
            <h3>ස්පාඤ්ඤ බසින් "එළුවන් උරා බොන්නා" යන අරුත ඇති <strong>චුපකබ්රා</strong> යනු ජනප්‍රවාදගත වන අද්භූත ජීවියෙකි.</h3>
        </div>
    </section>
</div>

<script>
    // Language Logic
    let currentLang = localStorage.getItem('preferredLang') || 'en';

    function updateLanguage() {
        const enElements = document.querySelectorAll('.lang-en');
        const siElements = document.querySelectorAll('.lang-si');
        const btn = document.getElementById('langToggleBtn');

        if (currentLang === 'si') {
            enElements.forEach(el => el.style.display = 'none');
            siElements.forEach(el => el.style.display = 'block');
            btn.innerText = 'English';
        } else {
            enElements.forEach(el => el.style.display = 'block');
            siElements.forEach(el => el.style.display = 'none');
            btn.innerText = 'සිංහල';
        }
    }

    function toggleLanguage() {
        currentLang = (currentLang === 'en') ? 'si' : 'en';
        localStorage.setItem('preferredLang', currentLang);
        updateLanguage();
    }

    // Run on page load
    window.onload = updateLanguage;

    // Sidebar functions
    function toggleSidebar() {
        document.getElementById("sidebarMenu").classList.toggle("open");
        document.getElementById("sidebarOverlay").classList.toggle("show");
    }
</script>

</body>
</html>
