<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags for Social Media Sharing -->
    <meta name="description" content="Discover the mystery of Cosmic Microwave Background (CMB) Radiation. / විශ්වයේ මූලාරම්භය පිළිබඳ සොයා බැලීම - CMB විකිරණය.">
    <meta property="og:title" content="CMB Radiation - The Echo of Creation">
    <meta property="og:description" content="Explore the ancient light that fills our universe. / අපගේ විශ්වය පුරා පවතින පුරාණ ආලෝකය පිළිබඳ ගවේෂණය.">
    <meta property="og:image" content="images/CMB_Map_Main.jpg">
    <meta property="og:type" content="article">
    
    <title>CMB Radiation - I T L</title>
    
    <style>
        /* ... ඔබගේ මුල් CSS ඒ ආකාරයෙන්ම තබා ගන්න ... */
        /* Language Toggle Button Styles */
        .lang-btn { background: #1e40af; color: white; border: 1px solid #fbbf24; padding: 5px 12px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        
        /* Language display logic */
        .lang-si { display: none; }
        
        .nav-controls { display: flex; align-items: center; gap: 15px; }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="nav-home">🏠 <span class="lang-en">Home</span><span class="lang-si">මුල් පිටුව</span></a>
    <div class="nav-controls">
        <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">සිංහල</button>
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    </div>
</nav>

<!-- Sidebar Overlay සහ Sidebar කොටස මෙතැනට අමුණන්න -->

<div class="container">
    <h1>CMB Radiation</h1>

    <section>
        <div class="lang-en">
            <h2>What is Cosmic Microwave Background Radiation?</h2>
            <h3>The Cosmic Microwave Background (CMB) is the oldest light in the universe.</h3>
        </div>
        <div class="lang-si">
            <h2>CMB විකිරණය යනු කුමක්ද?</h2>
            <h3>විශ්වයේ පවතින පැරණිතම ආලෝකය CMB විකිරණයයි. මෙය මහා පිපිරුමෙන් (Big Bang) වසර 380,000කට පසු ඇති වූවකි.</h3>
        </div>
    </section>
</div>

<script>
    // Language Logic - දත්ත ගබඩා කිරීම
    let currentLang = localStorage.getItem('preferredLang') || 'en';

    function updateLanguage() {
        const enElements = document.querySelectorAll('.lang-en');
        const siElements = document.querySelectorAll('.lang-si');
        const btn = document.getElementById('langToggleBtn');

        if (currentLang === 'si') {
            enElements.forEach(el => el.style.display = 'none');
            siElements.forEach(el => el.style.display = 'block');
            btn.innerText = 'English';
        } else {
            enElements.forEach(el => el.style.display = 'block');
            siElements.forEach(el => el.style.display = 'none');
            btn.innerText = 'සිංහල';
        }
    }

    function toggleLanguage() {
        currentLang = (currentLang === 'en') ? 'si' : 'en';
        localStorage.setItem('preferredLang', currentLang);
        updateLanguage();
    }

    // පිටුව පැටවෙන විට භාෂාව සැකසීම
    window.onload = updateLanguage;

    // Sidebar Toggle Function
    function toggleSidebar() {
        const sidebar = document.getElementById("sidebarMenu");
        const overlay = document.getElementById("sidebarOverlay");
        sidebar.classList.toggle("open");
        overlay.classList.toggle("show");
    }
</script>

<!-- මියුසික් සහ අනෙකුත් ස්ක්‍රිප්ට් මෙතැනට අමුණන්න -->
</body>
</html>
