<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tags for Social Media Sharing -->
    <meta name="description" content="Discover the legend of Cerberus, the three-headed guardian of the Underworld. / පාතාල ලෝකයේ ආරක්ෂකයා වන සෙබෙරස් පිළිබඳ පුරාවෘත්තය සොයා ගන්න.">
    <meta property="og:title" content="Cerberus - The Guardian of the Underworld">
    <meta property="og:description" content="Learn about the beast that guards the gates of Hades. / හේඩීස් දොරටු ආරක්ෂා කරන මෘගයා පිළිබඳ තොරතුරු දැනගන්න.">
    <meta property="og:image" content="images/cerberus.jpg">
    <meta property="og:type" content="article">
    
    <title>Cerberus - I T L</title>
    
    <style>
        :root {
            --neon-red: #ff003c;
            --neon-orange: #ff8a00;
            --bg-dark: #050101;
            --text-gray: #cccccc;
        }

        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-dark); color: var(--text-gray); margin: 0; line-height: 1.8; }

        /* Navigation */
        nav { background-color: #1a1a1a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 1000; }
        .nav-controls { display: flex; align-items: center; gap: 15px; }
        
        /* Language Toggle Button */
        .lang-btn { background: #333; color: white; border: 1px solid var(--neon-orange); padding: 5px 12px; cursor: pointer; border-radius: 5px; }
        
        .menu-toggle { background: none; border: none; color: #00d4ff; font-size: 28px; cursor: pointer; }

        /* Sidebar Styles (Same as original) */
        .sidebar { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background-color: #111; z-index: 10001; transition: right 0.3s; padding: 20px; }
        .sidebar.open { right: 0; }

        /* Language content toggling */
        .lang-si { display: none; }
        
        /* General Layout */
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { font-size: clamp(40px, 10vw, 75px); text-align: center; color: #fff; margin-top: 50px; text-shadow: 0 0 15px var(--neon-red); }
        .cerberus-img { max-width: 85%; height: auto; border-radius: 20px; display: block; margin: 0 auto; border: 2px solid var(--neon-orange); }
        section { background: rgba(255, 0, 60, 0.03); padding: 30px; border-radius: 20px; margin-bottom: 35px; border-right: 3px solid var(--neon-red); }
        h2 { color: var(--neon-orange); }
    </style>
</head>
<body>

<nav>
    <a href="index.html" style="color: #00d4ff; text-decoration: none; font-weight: bold;">🏠 <span class="lang-en">Home</span><span class="lang-si">මුල් පිටුව</span></a>
    <div class="nav-controls">
        <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">සිංහල</button>
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    </div>
</nav>

<div class="container">
    <h1>CERBERUS</h1>
    <img class="cerberus-img" src="images/cerberus.jpg" alt="Cerberus">

    <section>
        <div class="lang-en">
            <h2>The Hound of Hades</h2>
            <h3><strong>Cerberus</strong> is the monstrous multi-headed dog that guards the gates of the Underworld.</h3>
        </div>
        <div class="lang-si">
            <h2>හේඩීස්ගේ දඩයක්කාරයා</h2>
            <h3><strong>සෙබෙරස්</strong> යනු පාතාල ලෝකයේ දොරටු ආරක්ෂා කරන බහු-හිස් ඇති බිහිසුණු සුනඛයායි.</h3>
        </div>
    </section>
</div>

<script>
    // Language Logic
    let currentLang = localStorage.getItem('preferredLang') || 'en';

    function updateLanguage() {
        const en = document.querySelectorAll('.lang-en');
        const si = document.querySelectorAll('.lang-si');
        const btn = document.getElementById('langToggleBtn');

        if (currentLang === 'si') {
            en.forEach(e => e.style.display = 'none');
            si.forEach(e => e.style.display = 'block');
            btn.innerText = 'English';
        } else {
            en.forEach(e => e.style.display = 'block');
            si.forEach(e => e.style.display = 'none');
            btn.innerText = 'සිංහල';
        }
    }

    function toggleLanguage() {
        currentLang = (currentLang === 'en') ? 'si' : 'en';
        localStorage.setItem('preferredLang', currentLang);
        updateLanguage();
    }

    // Run on load
    window.onload = updateLanguage;
    
    function toggleSidebar() { document.getElementById("sidebarMenu").classList.toggle("open"); }
</script>

<!-- Sidebar සහ අනෙකුත් කොටස් මෙතැනට අමුණන්න -->
</body>
</html>
