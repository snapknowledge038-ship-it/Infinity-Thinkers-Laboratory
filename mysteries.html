<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="Uncover the world's greatest secrets with ITL. From ancient enigmas to unsolved scientific puzzles, join us as we explore the unknown and dive deep into mysteries.">
    <meta name="keywords" content="Unsolved Mysteries, Ancient Secrets, Supernatural, Historical Enigmas, Unknown Facts, ITL Mysteries, Paranormal Discoveries">
    <meta property="og:title" content="Mysteries – Exploring the Unknown | ITL">
    <meta property="og:description" content="Dive into the world's most fascinating unsolved mysteries and secrets.">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mysteries - I T L</title>
    <style>
        /* --- 🌐 LANGUAGE TOGGLE LOGIC --- */
        body.lang-si .lang-en { display: none !important; }
        body.lang-si .lang-si { display: block !important; }
        body:not(.lang-si) .lang-si { display: none !important; }
        
        /* මූලික සැකසුම් */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050505; 
            color: #b5b5b5; 
            margin: 0;
            padding: 0;
            line-height: 1.7;
            overflow-x: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* 🖥️ NAVIGATION BAR */
        nav {
            background-color: #0a0a0a;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-left { display: flex; gap: 20px; align-items: center; }
        .nav-right { display: flex; gap: 12px; align-items: center; }

        nav a { color: #888; text-decoration: none; font-weight: bold; font-size: 16px; transition: 0.3s; text-transform: uppercase; }
        nav a:hover { color: #ffffff; text-shadow: 0 0 10px #bbb; }

        .nav-btn { background: rgba(255, 255, 255, 0.02); color: #888; border: 1px solid #333; padding: 6px 14px; cursor: pointer; border-radius: 4px; transition: 0.3s; }
        .nav-btn.active { background: #fff; color: #000; font-weight: bold; }

        /* Mobile Sidebar */
        .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; }
        .hamburger span { display: block; width: 28px; height: 3px; background-color: #888; }
        
        .sidebar { position: fixed; top: 0; right: -280px; width: 280px; height: 100vh; background-color: #0a0a0a; padding: 80px 30px; transition: 0.4s; z-index: 999; border-left: 1px solid #222; }
        .sidebar.open { right: 0; }
        .sidebar a { display: block; padding: 10px 0; color: #fff; text-decoration: none; }

        @media (max-width: 950px) {
            .nav-left, .nav-right { display: none; }
            .hamburger { display: flex; }
        }

        /* මාතෘකාව සහ අන්තර්ගතය */
        h1 { text-align: center; color: #eee; text-transform: uppercase; margin-top: 40px; }
        .mysteries-img { max-width: 85%; height: auto; border-radius: 5px; filter: grayscale(85%) contrast(120%); display: block; margin: 0 auto; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .mystery-box { background: #0d0d0d; padding: 35px; border-radius: 10px; border: 1px solid #252525; }
        
        h3 { color: #ccc; border-left: 4px solid #666; padding-left: 15px; margin-top: 40px; }
        .mystery-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; list-style: none; padding: 0; }
        .mystery-list li { background: #0f0f0f; padding: 15px; border: 1px solid #222; transition: 0.3s; }
        .mystery-list li:hover { background: #222; transform: scale(1.02); }
        .mystery-list a { color: #999; text-decoration: none; display: block; }
    </style>
</head>
<body>

    <!-- භාෂා සැකසුම මුලින්ම ලෝඩ් කිරීමට -->
    <script>
        const savedLang = localStorage.getItem('siteLang') || 'en';
        document.body.classList.add(savedLang === 'si' ? 'lang-si' : 'lang-en');
    </script>

    <nav>
        <div class="nav-left">
            <a href="index.html">Home</a>
            <a href="mysteries.html">Mysteries</a>
        </div>
        <div class="nav-right">
            <button class="nav-btn btn-en" onclick="changeLanguage('en')">English</button>
            <button class="nav-btn btn-si" onclick="changeLanguage('si')">සිංහල</button>
        </div>
        <button class="hamburger" id="hamburger-menu" onclick="toggleSidebar()">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <div class="sidebar" id="mobile-sidebar">
        <a href="index.html">Home</a>
        <a href="mysteries.html">Mysteries</a>
        <button class="nav-btn" onclick="changeLanguage('en')">English</button>
        <button class="nav-btn" onclick="changeLanguage('si')">සිංහල</button>
    </div>

    <div class="container">
        <h1>
            <span class="lang-en">Mysteries – Exploring the Unknown</span>
            <span class="lang-si">අභිරහස් – නොදන්නා ලෝකය ගවේෂණය</span>
        </h1>

        <div class="mystery-box">
            <div class="lang-en">Welcome to the world of mysteries...</div>
            <div class="lang-si">අභිරහස් ලෝකයට සාදරයෙන් පිළිගනිමු...</div>
        </div>
        
        <h3>
            <span class="lang-en">Ancient Mythology</span>
            <span class="lang-si">පැරණි මිථ්‍යා කථා</span>
        </h3>
        <ul class="mystery-list">
            <li>
                <a href="dracula.html" class="lang-en">Dracula</a>
                <a href="dracula.html" class="lang-si">ඩ්‍රැකියුලා</a>
            </li>
        </ul>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('mobile-sidebar').classList.toggle('open');
        }

        function changeLanguage(lang) {
            localStorage.setItem('siteLang', lang);
            document.body.className = ''; 
            document.body.classList.add(lang === 'si' ? 'lang-si' : 'lang-en');
        }
    </script>
</body>
</html>
